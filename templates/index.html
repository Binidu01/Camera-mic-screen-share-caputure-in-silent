<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proctoring Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #0b0f17;
      --surface:     #131a26;
      --surface-2:   #1a2332;
      --border:      #232e42;
      --text:        #e6edf5;
      --text-dim:    #8794ab;
      --accent:      #4f8cff;
      --accent-glow: rgba(79, 140, 255, 0.35);
      --success:     #22c55e;
      --danger:      #ef4444;
      --radius:      14px;
      --shadow:      0 8px 32px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.5; min-height: 100vh;
    }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11, 15, 23, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #7c5cff);
      display: grid; place-items: center;
      font-weight: 700; font-size: 17px;
      box-shadow: 0 0 24px var(--accent-glow);
    }
    .brand h1 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
    .brand small { display: block; color: var(--text-dim); font-size: 0.72rem; font-weight: 400; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.9rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: 999px;
      font-size: 0.8rem; color: var(--text-dim);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim); transition: background 0.3s;
    }
    .dot.live { background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulse 1.6s ease-in-out infinite; }
    .dot.offline { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .6; transform: scale(.9); } }

    main {
      max-width: 1800px; margin: 0 auto; padding: 1.25rem 1.5rem 2rem;
      display: grid; grid-template-columns: 1fr 1fr;
      grid-template-areas: "cam screen";
      gap: 1.25rem;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-areas: "cam" "screen"; padding: 1rem; }
    }
    .area-cam    { grid-area: cam; }
    .area-screen { grid-area: screen; }

    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden; display: flex; flex-direction: column; min-width: 0;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.15rem; border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    }
    .panel-title { display: flex; align-items: center; gap: 0.6rem; font-weight: 600; font-size: 0.92rem; }
    .panel-title svg { width: 17px; height: 17px; color: var(--accent); }
    .panel-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 1rem; min-width: 0; }

    .video-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: #05080e; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .video-wrap video {
      width: 100%; height: 100%; object-fit: contain;
      display: block; background: #05080e;
    }
    .video-wrap .placeholder {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 1rem;
    }
    .video-wrap .badge {
      position: absolute; top: 0.6rem; left: 0.6rem;
      padding: 0.25rem 0.6rem; background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px); border-radius: 6px;
      font-size: 0.7rem; font-weight: 500; letter-spacing: 0.03em;
      text-transform: uppercase; color: var(--text-dim);
      display: flex; align-items: center; gap: 0.4rem;
    }
    .video-wrap .badge .dot { width: 6px; height: 6px; }

    .audio-indicator {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.78rem; color: var(--text-dim);
    }
    .audio-indicator.live { color: var(--success); }
    .audio-indicator.blocked { color: var(--danger); }

    .level-meter { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
    .level-meter span {
      width: 3px; height: 4px; border-radius: 2px;
      background: var(--surface-2); transition: height 0.08s, background 0.08s;
    }
    .level-meter.active span { background: var(--success); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">P</div>
      <div>
        <h1>Proctoring Dashboard</h1>
        <small>Live monitoring console</small>
      </div>
    </div>
    <div style="display:flex; gap:0.6rem; align-items:center;">
      <div class="audio-indicator" id="audioIndicator">
        <div class="level-meter" id="levelMeter">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span id="audioStatus">Audio: waiting</span>
      </div>
      <div class="status-pill">
        <span class="dot" id="connDot"></span>
        <span id="connText">Connecting…</span>
      </div>
    </div>
  </header>

  <main>
    <section class="panel area-cam">
      <div class="panel-header">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          Webcam Feed
        </div>
      </div>
      <div class="panel-body">
        <div class="video-wrap">
          <span class="badge"><span class="dot" id="camDot"></span>Camera</span>
          <div class="placeholder" id="camPlaceholder">Waiting for client…</div>
          <video id="webcam" autoplay playsinline muted style="display:none;"></video>
        </div>
      </div>
    </section>

    <section class="panel area-screen">
      <div class="panel-header">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Screen Share
        </div>
      </div>
      <div class="panel-body">
        <div class="video-wrap">
          <span class="badge"><span class="dot" id="screenDot"></span>Screen</span>
          <div class="placeholder" id="screenPlaceholder">Waiting for client…</div>
          <video id="screen" autoplay playsinline muted style="display:none;"></video>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    // ─────────── Connection indicator ───────────
    const connDot  = document.getElementById('connDot');
    const connText = document.getElementById('connText');

    function setConnected() {
      connDot.classList.add('live'); connDot.classList.remove('offline');
      connText.textContent = 'Connected';
    }
    function setDisconnected(msg) {
      connDot.classList.remove('live'); connDot.classList.add('offline');
      connText.textContent = msg || 'Disconnected';
    }

    // ─────────── LiveKit room ───────────
    const room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true,
    });

    const webcamEl = document.getElementById('webcam');
    const screenEl = document.getElementById('screen');
    const camPlaceholder = document.getElementById('camPlaceholder');
    const screenPlaceholder = document.getElementById('screenPlaceholder');
    const camDot = document.getElementById('camDot');
    const screenDot = document.getElementById('screenDot');

    function attachVideo(el, placeholder, dot) {
      el.style.display = 'block';
      placeholder.style.display = 'none';
      dot.classList.add('live');
    }

    // Called when a remote track (from client.py) is subscribed
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
      console.log('Track subscribed:', track.kind, track.source, track.name);

      if (track.kind === 'video') {
        // Screen share has source === 'screen_share'; webcam has source === 'camera'
        if (track.source === 'screen_share' || track.name === 'screen') {
          track.attach(screenEl);
          attachVideo(screenEl, screenPlaceholder, screenDot);
        } else {
          track.attach(webcamEl);
          attachVideo(webcamEl, camPlaceholder, camDot);
        }
      } else if (track.kind === 'audio') {
        // Attach audio to a hidden element (created by LiveKit)
        const el = track.attach();
        el.style.display = 'none';
        document.body.appendChild(el);
        updateAudioUI(true);
      }
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
      console.log('Track unsubscribed:', track.kind, track.source);
      track.detach();
      if (track.kind === 'video') {
        if (track.source === 'screen_share' || track.name === 'screen') {
          screenEl.srcObject = null;
          screenEl.style.display = 'none';
          screenPlaceholder.style.display = 'grid';
          screenDot.classList.remove('live');
        } else {
          webcamEl.srcObject = null;
          webcamEl.style.display = 'none';
          camPlaceholder.style.display = 'grid';
          camDot.classList.remove('live');
        }
      } else if (track.kind === 'audio') {
        updateAudioUI(false);
      }
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      setDisconnected('Disconnected');
    });

    // ─────────── Audio UI + level meter ───────────
    const audioStatusEl = document.getElementById('audioStatus');
    const audioIndicator = document.getElementById('audioIndicator');
    const levelMeter = document.getElementById('levelMeter');
    const meterBars = levelMeter.querySelectorAll('span');

    // LiveKit doesn't expose an AnalyserNode directly, so we build our own
    // analyser by creating a MediaStream from the subscribed audio track.
    let analyserCtx = null;
    let analyser = null;

    function startMeter(mediaStreamTrack) {
      try {
        if (!analyserCtx) {
          analyserCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const stream = new MediaStream([mediaStreamTrack]);
        const src = analyserCtx.createMediaStreamSource(stream);
        analyser = analyserCtx.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);

        const tmp = new Uint8Array(analyser.fftSize);
        function draw() {
          if (analyserCtx.state === 'running') {
            analyser.getByteTimeDomainData(tmp);
            let sum = 0;
            for (let i = 0; i < tmp.length; i++) {
              const v = (tmp[i] - 128) / 128;
              sum += v * v;
            }
            const rms = Math.sqrt(sum / tmp.length);
            const db  = 20 * Math.log10(rms + 1e-6);
            const active = Math.max(0, Math.min(meterBars.length,
              Math.round(((db + 60) / 60) * meterBars.length)));
            meterBars.forEach((b, idx) => {
              b.style.height = (idx < active ? 16 : 4) + 'px';
              b.style.background = idx < active ? 'var(--success)' : 'var(--surface-2)';
            });
          }
          requestAnimationFrame(draw);
        }
        draw();
      } catch (e) {
        console.warn('Meter init failed:', e);
      }
    }

    // Also start meter on audio subscriptions specifically
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === 'audio' && track.mediaStreamTrack) {
        startMeter(track.mediaStreamTrack);
      }
    });

    function updateAudioUI(live) {
      if (live) {
        audioStatusEl.textContent = 'Audio: live';
        audioIndicator.classList.remove('blocked');
        audioIndicator.classList.add('live');
        levelMeter.classList.add('active');
      } else {
        audioStatusEl.textContent = 'Audio: waiting';
        audioIndicator.classList.remove('live');
        audioIndicator.classList.remove('blocked');
        levelMeter.classList.remove('active');
      }
    }

    // ─────────── Full-screen click-to-start audio gate ───────────
    const gate = document.createElement('div');
    gate.id = 'audioGate';
    gate.innerHTML = '🔊 Click anywhere to start';
    Object.assign(gate.style, {
      position: 'fixed', inset: '0', zIndex: 9999,
      background: 'rgba(5, 8, 14, 0.92)',
      display: 'grid', placeItems: 'center',
      color: '#e6edf5', cursor: 'pointer',
      fontFamily: 'Inter, system-ui, sans-serif',
      fontSize: '1.15rem', letterSpacing: '0.02em',
      backdropFilter: 'blur(6px)',
    });
    document.body.appendChild(gate);

    async function unlockAudio() {
      try {
        await room.startAudio();
        gate.remove();
      } catch (e) {
        // Not fatal; user can click again later
        console.warn('startAudio failed:', e);
      }
    }

    ['click','touchstart','pointerdown','keydown'].forEach(e =>
      window.addEventListener(e, unlockAudio, { passive: true }));

    // ─────────── Connect to LiveKit ───────────
    async function connect() {
      try {
        const resp = await fetch('/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identity: 'viewer' }),
        });
        if (!resp.ok) throw new Error('Token fetch failed: ' + resp.status);
        const { token, url } = await resp.json();

        await room.connect(url, token);
        setConnected();
        console.log('Connected to LiveKit room:', room.name);
      } catch (e) {
        console.error('Connect failed:', e);
        setDisconnected('Connection error');
      }
    }

    connect();
  </script>

</body>
</html>
