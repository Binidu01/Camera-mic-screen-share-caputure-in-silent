# .github/workflows/release.yml
name: Build and Release Client

on:
  push:
    branches:
      - main
    paths:
      - 'client.py'
      - 'client-requirements.txt'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version tag
        id: version
        shell: bash
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
          else
            VER="${LATEST#v}"
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Latest tag: $LATEST"
          echo "Next tag:   $NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client-requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name client --hidden-import livekit.rtc.resources --collect-data livekit --collect-binaries livekit client.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: dist/client.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/client.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
